<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Etavioxy</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    ;(function () {
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      var setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
      if (setting === 'dark' || (prefersDark && setting !== 'light'))
        document.documentElement.classList.add('dark')
    })()
  </script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #333;
      font: 16px/1.7 Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    html.dark body { background: #050505; color: #ddd; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 5rem; margin: 0; opacity: .15; letter-spacing: .1em; }
    p { opacity: .6; margin-top: 1rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>页面不存在，<a href="/">回首页</a>。</p>
  </main>
</body>
</html>
